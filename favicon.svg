<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
						<defs><clipPath id="fav-clip"><circle cx="100" cy="100" r="96"/></clipPath></defs>
						<circle fill="#f3d9a8" cx="100" cy="100" r="96"/>
						<g clip-path="url(#fav-clip)">
							<!-- shirt -->
							<path d="M24 205 Q28 150 78 143 L122 143 Q172 150 176 205 Z" fill="#fbf4e6"/>
							<!-- neck -->
							<path d="M86 118 L114 118 L116 146 Q100 158 84 146 Z" fill="#e9b793"/>
							<!-- suspenders -->
							<path d="M58 152 L72 148 L80 205 L62 205 Z" fill="#9db39a"/>
							<path d="M142 152 L128 148 L120 205 L138 205 Z" fill="#9db39a"/>
							<!-- chain -->
							<path d="M84 148 Q100 184 116 148" fill="none" stroke="#e2b04a" stroke-width="2.5" stroke-linecap="round"/>
							<!-- ears -->
							<ellipse cx="61" cy="88" rx="5.5" ry="9" fill="#efc09c"/>
							<ellipse cx="139" cy="88" rx="5.5" ry="9" fill="#efc09c"/>
							<!-- head -->
							<ellipse cx="100" cy="82" rx="39" ry="45" fill="#f4c9a8"/>
							<!-- buzzed hair -->
							<path d="M62 76 Q60 38 100 36 Q140 38 138 76 Q132 56 100 54 Q68 56 62 76 Z" fill="#c9a074"/>
							<!-- beard -->
							<path d="M61 88 Q60 140 100 140 Q140 140 139 88 Q133 112 118 112 Q100 104 82 112 Q67 112 61 88 Z" fill="#b8582b"/>
							<!-- cheeks -->
							<ellipse cx="76" cy="98" rx="7" ry="4" fill="#f09a86" opacity=".45"/>
							<ellipse cx="124" cy="98" rx="7" ry="4" fill="#f09a86" opacity=".45"/>
							<!-- mouth -->
							<path d="M91 121 Q100 128 109 121" fill="none" stroke="#6b2f1a" stroke-width="2.6" stroke-linecap="round"/>
							<!-- nose -->
							<path d="M97 90 Q100 101 104 97" fill="none" stroke="#d79a76" stroke-width="2.2" stroke-linecap="round"/>
							<!-- eyes (blink + follow the cursor) -->
							<g>
								<g>
									<circle cx="85" cy="82" r="3.4" fill="#2f2850"/>
									<circle cx="86" cy="80.8" r="1.1" fill="#fff"/>
								</g>
							</g>
							<g>
								<g>
									<circle cx="115" cy="82" r="3.4" fill="#2f2850"/>
									<circle cx="116" cy="80.8" r="1.1" fill="#fff"/>
								</g>
							</g>
							<!-- brows -->
							<path d="M77 72 Q85 67 93 71" fill="none" stroke="#a9744b" stroke-width="3" stroke-linecap="round"/>
							<path d="M107 71 Q115 67 123 72" fill="none" stroke="#a9744b" stroke-width="3" stroke-linecap="round"/>
						</g>
					</svg>
